name: Desktop release coordinator
run-name: Desktop release coordinator ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Exact enduragent-desktop@<version> tag"
        required: true
        type: string
      desktop_mode:
        description: "macOS release continuity mode"
        type: choice
        default: steady
        options:
          - steady
          - genesis
      desktop_baseline_tag:
        description: "Explicit prior signed desktop release tag; leave empty to require repository latest"
        required: false
        default: ""
      recovery_tooling_tag:
        description: "Optional immutable enduragent-desktop@<version>-recovery.<revision> tooling tag"
        required: false
        default: ""
        type: string
      recovery_source_run_id:
        description: "Optional failed desktop release run whose immutable signed artifacts should be resumed"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: stable-desktop-coordinator
  cancel-in-progress: false
  queue: max

jobs:
  bind-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      tag: ${{ steps.bind.outputs.tag }}
      desktop_version: ${{ steps.bind.outputs.desktop_version }}
      commit: ${{ steps.bind.outputs.commit }}
      tooling_commit: ${{ steps.bind.outputs.tooling_commit }}
      mode: ${{ steps.bind.outputs.mode }}
      baseline_tag: ${{ steps.bind.outputs.baseline_tag }}
      source_run_id: ${{ steps.bind.outputs.source_run_id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind desktop tag, version, and source commit
        id: bind
        env:
          RELEASE_TAG_INPUT: ${{ inputs.tag }}
          RELEASE_MODE_INPUT: ${{ inputs.desktop_mode }}
          RELEASE_BASELINE_TAG_INPUT: ${{ inputs.desktop_baseline_tag }}
          RECOVERY_TOOLING_TAG_INPUT: ${{ inputs.recovery_tooling_tag }}
          RECOVERY_SOURCE_RUN_ID_INPUT: ${{ inputs.recovery_source_run_id }}
          DESKTOP_ENABLED: ${{ vars.ENABLE_DESKTOP_MACOS_RELEASE }}
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          test "$DESKTOP_ENABLED" = 'true'
          TAG="$RELEASE_TAG_INPUT"
          if ! printf '%s' "$TAG" | grep -Eq '^enduragent-desktop@(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::Desktop tag '$TAG' is invalid"
            exit 1
          fi
          VERSION="${TAG#enduragent-desktop@}"
          git fetch --force --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          COMMIT=$(git rev-parse "refs/tags/$TAG^{commit}")
          MANIFEST_VERSION=$(git show "$COMMIT:apps/desktop/package.json" | jq -er '.version')
          if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
            echo "::error::Desktop tag version $VERSION does not match apps/desktop/package.json $MANIFEST_VERSION"
            exit 1
          fi
          git fetch --force --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$COMMIT" refs/remotes/origin/main; then
            echo '::error::Desktop release commit must be merged into main'
            exit 1
          fi
          MODE="$RELEASE_MODE_INPUT"
          if [ "$MODE" != 'steady' ] && [ "$MODE" != 'genesis' ]; then
            echo "::error::Unsupported desktop release mode '$MODE'"
            exit 1
          fi
          TOOLING_COMMIT="$COMMIT"
          if [ -n "$RECOVERY_TOOLING_TAG_INPUT" ]; then
            if [ "$MODE" != 'steady' ]; then
              echo '::error::Recovery tooling is allowed only for steady desktop releases'
              exit 1
            fi
            RECOVERY_TAG="$RECOVERY_TOOLING_TAG_INPUT"
            RECOVERY_REVISION="${RECOVERY_TAG#"${TAG}-recovery."}"
            if ! printf '%s' "$RECOVERY_REVISION" | grep -Eq '^[1-9][0-9]*$' || \
               [ "$RECOVERY_TAG" != "${TAG}-recovery.${RECOVERY_REVISION}" ]; then
              echo "::error::Recovery tooling tag must be exactly ${TAG}-recovery.<positive integer>"
              exit 1
            fi
            git fetch --force --no-tags origin \
              "refs/tags/$RECOVERY_TAG:refs/tags/$RECOVERY_TAG"
            TOOLING_COMMIT=$(git rev-parse "refs/tags/$RECOVERY_TAG^{commit}")
            test "$TOOLING_COMMIT" != "$COMMIT"
            test "$WORKFLOW_REF" = "refs/tags/$RECOVERY_TAG"
            test "$WORKFLOW_SHA" = "$TOOLING_COMMIT"
            if ! git merge-base --is-ancestor "$COMMIT" "$TOOLING_COMMIT"; then
              echo '::error::Candidate commit must be an ancestor of recovery tooling'
              exit 1
            fi
            if ! git merge-base --is-ancestor "$TOOLING_COMMIT" refs/remotes/origin/main; then
              echo '::error::Recovery tooling commit must be merged into main'
              exit 1
            fi
          else
            test "$WORKFLOW_REF" = "refs/tags/$TAG"
            test "$WORKFLOW_SHA" = "$COMMIT"
          fi
          SOURCE_RUN_ID=none
          if [ -n "$RECOVERY_SOURCE_RUN_ID_INPUT" ]; then
            if [ -z "$RECOVERY_TOOLING_TAG_INPUT" ] || [ "$MODE" != 'steady' ]; then
              echo '::error::A recovery source run requires steady mode and an immutable recovery tooling tag'
              exit 1
            fi
            printf '%s' "$RECOVERY_SOURCE_RUN_ID_INPUT" | grep -Eq '^[1-9][0-9]*$'
            SOURCE_RUN_ID="$RECOVERY_SOURCE_RUN_ID_INPUT"
            SOURCE_RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")
            SOURCE_WORKFLOW_PATH_RAW=$(printf '%s' "$SOURCE_RUN" | jq -er '.path')
            SOURCE_WORKFLOW_PATH="${SOURCE_WORKFLOW_PATH_RAW%%@*}"
            case "$SOURCE_WORKFLOW_PATH" in
              .github/workflows/desktop-release.yml)
                test "$(printf '%s' "$SOURCE_RUN" | jq -r '.actor.login')" = 'github-actions[bot]'
                test "$(printf '%s' "$SOURCE_RUN" | jq -r '.triggering_actor.login')" = 'github-actions[bot]'
                ;;
              .github/workflows/desktop-release-coordinator.yml)
                ;;
              *)
                echo '::error::Recovery source run used an untrusted workflow'
                exit 1
                ;;
            esac
            test "$(printf '%s' "$SOURCE_RUN" | jq -r '.event')" = 'workflow_dispatch'
            test "$(printf '%s' "$SOURCE_RUN" | jq -r '.status')" = 'completed'
            test "$(printf '%s' "$SOURCE_RUN" | jq -r '.conclusion')" = 'failure'
            test "$(printf '%s' "$SOURCE_RUN" | jq -r '.repository.full_name')" = "$GITHUB_REPOSITORY"
            test "$(printf '%s' "$SOURCE_RUN" | jq -r '.head_repository.full_name')" = "$GITHUB_REPOSITORY"
            SOURCE_ATTEMPT=$(printf '%s' "$SOURCE_RUN" | jq -er '.run_attempt')
            printf '%s' "$SOURCE_ATTEMPT" | grep -Eq '^[1-9][0-9]*$'
            SOURCE_HEAD=$(printf '%s' "$SOURCE_RUN" | jq -er '.head_branch')
            SOURCE_SHA=$(printf '%s' "$SOURCE_RUN" | jq -er '.head_sha')
            printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'
            case "$SOURCE_WORKFLOW_PATH_RAW" in
              "$SOURCE_WORKFLOW_PATH"|"$SOURCE_WORKFLOW_PATH@$SOURCE_HEAD"|"$SOURCE_WORKFLOW_PATH@refs/tags/$SOURCE_HEAD")
                ;;
              *)
                echo '::error::Recovery source workflow path used an unexpected ref suffix'
                exit 1
                ;;
            esac
            CURRENT_RECOVERY_REVISION="${RECOVERY_TOOLING_TAG_INPUT#"${TAG}-recovery."}"
            if [ "$SOURCE_HEAD" = "$TAG" ]; then
              test "$SOURCE_SHA" = "$COMMIT"
            else
              SOURCE_REVISION="${SOURCE_HEAD#"${TAG}-recovery."}"
              printf '%s' "$SOURCE_REVISION" | grep -Eq '^[1-9][0-9]*$'
              test "$SOURCE_HEAD" = "${TAG}-recovery.${SOURCE_REVISION}"
              test "$SOURCE_REVISION" -lt "$CURRENT_RECOVERY_REVISION"
            fi
            git fetch --force --no-tags origin "refs/tags/$SOURCE_HEAD:refs/tags/$SOURCE_HEAD"
            test "$(git rev-parse "refs/tags/$SOURCE_HEAD^{commit}")" = "$SOURCE_SHA"
            git merge-base --is-ancestor "$COMMIT" "$SOURCE_SHA"
            git merge-base --is-ancestor "$SOURCE_SHA" "$TOOLING_COMMIT"
            git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main
            SOURCE_JOBS=$(gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/attempts/$SOURCE_ATTEMPT/jobs?per_page=100")
            printf '%s' "$SOURCE_JOBS" | jq -e \
              'type == "array" and length > 0 and ([.[].jobs[]] | length) == .[0].total_count' >/dev/null
            for required_job in sign-macos verify-macos-envelope stage-private-draft publish-assets; do
              printf '%s' "$SOURCE_JOBS" | jq -e --arg name "$required_job" '
                [.[].jobs[] | select((.name | split(" / ") | last) == $name)] as $matches |
                ($matches | length) == 1 and
                $matches[0].status == "completed" and
                $matches[0].conclusion == "success"
              ' >/dev/null
            done
            printf '%s' "$SOURCE_JOBS" | jq -e '
              [.[].jobs[] | select((.name | split(" / ") | last) == "activate-release")] as $matches |
              ($matches | length) == 1 and
              $matches[0].status == "completed" and
              $matches[0].conclusion != "success"
            ' >/dev/null
            SOURCE_ARTIFACTS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100")
            for artifact_name in "desktop-release-$SOURCE_RUN_ID-$SOURCE_ATTEMPT" "desktop-baseline-$SOURCE_RUN_ID-$SOURCE_ATTEMPT"; do
              ARTIFACT=$(printf '%s' "$SOURCE_ARTIFACTS" | jq -ec --arg name "$artifact_name" '[.artifacts[] | select(.name == $name)] | if length == 1 then .[0] else error("artifact cardinality") end')
              test "$(printf '%s' "$ARTIFACT" | jq -r '.expired')" = 'false'
              printf '%s' "$(printf '%s' "$ARTIFACT" | jq -er '.id')" | grep -Eq '^[1-9][0-9]*$'
              printf '%s' "$(printf '%s' "$ARTIFACT" | jq -er '.digest')" | grep -Eq '^sha256:[0-9a-f]{64}$'
              test "$(printf '%s' "$ARTIFACT" | jq -r '.workflow_run.id')" = "$SOURCE_RUN_ID"
              test "$(printf '%s' "$ARTIFACT" | jq -r '.workflow_run.repository_id')" = "$REPOSITORY_ID"
              test "$(printf '%s' "$ARTIFACT" | jq -r '.workflow_run.head_repository_id')" = "$REPOSITORY_ID"
              test "$(printf '%s' "$ARTIFACT" | jq -r '.workflow_run.head_branch')" = "$SOURCE_HEAD"
              test "$(printf '%s' "$ARTIFACT" | jq -r '.workflow_run.head_sha')" = "$SOURCE_SHA"
            done
          fi
          BASELINE_TAG=none
          if [ -n "$RELEASE_BASELINE_TAG_INPUT" ]; then
            BASELINE_TAG="$RELEASE_BASELINE_TAG_INPUT"
          fi
          if [ "$MODE" = 'genesis' ] && [ "$BASELINE_TAG" != 'none' ]; then
            echo '::error::Genesis cannot consume a prior desktop baseline'
            exit 1
          fi
          if [ "$BASELINE_TAG" != 'none' ] && \
             [ "$BASELINE_TAG" != 'cycling-coach@2026.8.8' ] && \
             ! printf '%s' "$BASELINE_TAG" | grep -Eq '^enduragent-desktop@(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo '::error::Explicit desktop baseline tag is invalid'
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "desktop_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "tooling_commit=$TOOLING_COMMIT" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "baseline_tag=$BASELINE_TAG" >> "$GITHUB_OUTPUT"
          echo "source_run_id=$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"

  prepare-release-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: bind-release
    permissions:
      contents: write
    outputs:
      draft_id: ${{ steps.release-draft.outputs.draft_id }}
      body_sha256: ${{ steps.release-draft.outputs.body_sha256 }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.bind-release.outputs.commit }}
          persist-credentials: false
      - name: Create or validate bound desktop release draft
        id: release-draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.bind-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.bind-release.outputs.desktop_version }}
          RELEASE_COMMIT: ${{ needs.bind-release.outputs.commit }}
          RELEASE_SOURCE_RUN_ID: ${{ needs.bind-release.outputs.source_run_id }}
        run: |
          set -euo pipefail
          FIRST_HEADING=$(grep -m1 '^## ' apps/desktop/CHANGELOG.md)
          test "$FIRST_HEADING" = "## $RELEASE_VERSION"
          BODY=$(awk '/^## /{i++} i==1{print} i==2{exit}' apps/desktop/CHANGELOG.md | tail -n +2)
          test -n "$BODY"
          BODY_SHA256=$(printf '%s' "$BODY" | shasum -a 256 | awk '{print $1}')
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            RELEASE_JSON=$(gh release view "$RELEASE_TAG" --json body,databaseId,isDraft,isPrerelease,tagName)
            test "$(printf '%s' "$RELEASE_JSON" | jq -r '.tagName')" = "$RELEASE_TAG"
            test "$(printf '%s' "$RELEASE_JSON" | jq -r '.isPrerelease')" = 'false'
            if [ "$(printf '%s' "$RELEASE_JSON" | jq -r '.isDraft')" = 'true' ]; then
              EXISTING_BODY_SHA256=$(printf '%s' "$RELEASE_JSON" | jq -j '.body' | shasum -a 256 | awk '{print $1}')
              test "$EXISTING_BODY_SHA256" = "$BODY_SHA256"
            else
              test "$RELEASE_SOURCE_RUN_ID" != 'none'
              if [ "$(printf '%s' "$RELEASE_JSON" | jq -r '.body')" != 'Desktop update validation is in progress. This release is not yet generally available.' ]; then
                EXISTING_BODY_SHA256=$(printf '%s' "$RELEASE_JSON" | jq -j '.body' | shasum -a 256 | awk '{print $1}')
                test "$EXISTING_BODY_SHA256" = "$BODY_SHA256"
                LATEST_JSON=$(gh api -H 'Cache-Control: no-cache' "repos/$GITHUB_REPOSITORY/releases/latest")
                test "$(printf '%s' "$LATEST_JSON" | jq -r '.id | tostring')" = "$(printf '%s' "$RELEASE_JSON" | jq -r '.databaseId | tostring')"
                test "$(printf '%s' "$LATEST_JSON" | jq -r '.tag_name')" = "$RELEASE_TAG"
              fi
            fi
          else
            test "$RELEASE_SOURCE_RUN_ID" = 'none'
            gh release create "$RELEASE_TAG" --draft --latest=false --target "$RELEASE_COMMIT" \
              --title "Enduragent Desktop $RELEASE_VERSION" --notes "$BODY"
            RELEASE_JSON=$(gh release view "$RELEASE_TAG" --json databaseId,isDraft,isPrerelease,tagName)
          fi
          DRAFT_ID=$(printf '%s' "$RELEASE_JSON" | jq -r '.databaseId')
          printf '%s' "$DRAFT_ID" | grep -Eq '^[1-9][0-9]*$'
          echo "draft_id=$DRAFT_ID" >> "$GITHUB_OUTPUT"
          echo "body_sha256=$BODY_SHA256" >> "$GITHUB_OUTPUT"

  desktop-release:
    needs: [bind-release, prepare-release-draft]
    concurrency:
      group: stable-desktop
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/desktop-release.yml
    with:
      tag: ${{ needs.bind-release.outputs.tag }}
      desktop_version: ${{ needs.bind-release.outputs.desktop_version }}
      commit: ${{ needs.bind-release.outputs.commit }}
      tooling_commit: ${{ needs.bind-release.outputs.tooling_commit }}
      draft_id: ${{ needs.prepare-release-draft.outputs.draft_id }}
      mode: ${{ needs.bind-release.outputs.mode }}
      draft_body_sha256: ${{ needs.prepare-release-draft.outputs.body_sha256 }}
      baseline_tag: ${{ needs.bind-release.outputs.baseline_tag }}
      source_run_id: ${{ needs.bind-release.outputs.source_run_id }}

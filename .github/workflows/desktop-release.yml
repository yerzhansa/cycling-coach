          repository: ${{ github.repository }}
          run-id: ${{ needs.sign-macos.outputs.evidence_run_id }}
          digest-mismatch: error
      - name: Bind immutable Actions artifact evidence
        env:
          ARTIFACT_ID: ${{ needs.sign-macos.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.sign-macos.outputs.artifact_digest }}
          ARTIFACT_NAME: ${{ needs.sign-macos.outputs.artifact_name }}
          EVIDENCE_RUN_ID: ${{ needs.sign-macos.outputs.evidence_run_id }}
          EVIDENCE_RUN_ATTEMPT: ${{ needs.sign-macos.outputs.evidence_run_attempt }}
        run: |
          set -euo pipefail
          printf '%s' "$ARTIFACT_ID" | grep -Eq '^[1-9][0-9]*$'
          printf '%s' "$ARTIFACT_DIGEST" | grep -Eq '^[0-9a-f]{64}$'
          printf '%s' "$EVIDENCE_RUN_ID" | grep -Eq '^[1-9][0-9]*$'
          printf '%s' "$EVIDENCE_RUN_ATTEMPT" | grep -Eq '^[1-9][0-9]*$'
          test "$ARTIFACT_NAME" = "desktop-release-$EVIDENCE_RUN_ID-$EVIDENCE_RUN_ATTEMPT"
      - name: Reconcile repository latest read-only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROMOTION_OUTCOME: ${{ needs.request-latest.outputs.promotion_outcome }}
        run: |
          set -euo pipefail
          case "$PROMOTION_OUTCOME" in
            ''|applied|unknown)
              ;;
            foreign|unapplied)
              echo "::error::Latest promotion reached a terminal $PROMOTION_OUTCOME outcome"
              exit 1
              ;;
            *)
              echo "::error::Latest promotion outcome is invalid"
              exit 1
              ;;
          esac
          pnpm desktop-release:transaction reconcile --directory "$RUNNER_TEMP/desktop-release"

  verify-production-update:
    runs-on: macos-15
    timeout-minutes: 30
    needs: [sign-macos, reconcile-latest]
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Bind recovery release tooling
        env:
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_TOOLING_COMMIT: ${{ inputs.tooling_commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          if [ "$RELEASE_TOOLING_COMMIT" = "$RELEASE_COMMIT" ]; then
            exit 0
          fi
          git fetch --no-tags origin "$RELEASE_TOOLING_COMMIT"
          git restore --source="$RELEASE_TOOLING_COMMIT" --staged --worktree -- \
            apps/desktop/scripts/development-package-plan.mjs \
            apps/desktop/scripts/macos-release-plan.mjs \
            apps/desktop/scripts/package-inventory.mjs \
            apps/desktop/scripts/package-plan.mjs \
            apps/desktop/scripts/support/ \
            apps/desktop/scripts/verify-macos-release.mjs \
            apps/desktop/scripts/verify-package-layout.mjs \
            apps/desktop/scripts/verify-updater-round-trip.mjs \
            tools/desktop-release-transaction.ts
          EXPECTED_RECOVERY_DIFF=$'apps/desktop/scripts/development-package-plan.mjs\napps/desktop/scripts/macos-release-plan.mjs\napps/desktop/scripts/package-inventory.mjs\napps/desktop/scripts/package-plan.mjs\napps/desktop/scripts/support/desktop-cdp.ts\napps/desktop/scripts/support/packaged-telegram/acceptance-deadline.ts\napps/desktop/scripts/support/packaged-telegram/daemon-utility.ts\napps/desktop/scripts/support/packaged-telegram/disposable-keychain.ts\napps/desktop/scripts/support/packaged-telegram/main-entry.ts\napps/desktop/scripts/support/packaged-telegram/package-acceptance.d.mts\napps/desktop/scripts/support/packaged-telegram/package-acceptance.mjs\napps/desktop/scripts/support/packaged-telegram/process-safety.ts\napps/desktop/scripts/support/packaged-telegram/startup-mode.ts\napps/desktop/scripts/support/packaged-telegram/telegram-fetch-route.ts\napps/desktop/scripts/verify-macos-release.mjs\napps/desktop/scripts/verify-package-layout.mjs\napps/desktop/scripts/verify-updater-round-trip.mjs\ntools/desktop-release-transaction.ts'
          test "$(git diff --cached --name-only)" = "$EXPECTED_RECOVERY_DIFF"
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build updater acceptance dependencies
        run: pnpm --filter '@enduragent/desktop^...' build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.sign-macos.outputs.artifact_id }}
          path: ${{ runner.temp }}/desktop-release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.sign-macos.outputs.evidence_run_id }}
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.sign-macos.outputs.baseline_artifact_id }}
          path: ${{ runner.temp }}/desktop-baseline
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.sign-macos.outputs.evidence_run_id }}
          digest-mismatch: error
      - name: Bind immutable candidate and baseline artifacts
        env:
          CANDIDATE_ID: ${{ needs.sign-macos.outputs.artifact_id }}
          CANDIDATE_DIGEST: ${{ needs.sign-macos.outputs.artifact_digest }}
          CANDIDATE_NAME: ${{ needs.sign-macos.outputs.artifact_name }}
          BASELINE_ID: ${{ needs.sign-macos.outputs.baseline_artifact_id }}
          BASELINE_DIGEST: ${{ needs.sign-macos.outputs.baseline_artifact_digest }}
          BASELINE_NAME: ${{ needs.sign-macos.outputs.baseline_artifact_name }}
          EVIDENCE_RUN_ID: ${{ needs.sign-macos.outputs.evidence_run_id }}
          EVIDENCE_RUN_ATTEMPT: ${{ needs.sign-macos.outputs.evidence_run_attempt }}
        run: |
          set -euo pipefail
          printf '%s' "$CANDIDATE_ID" | grep -Eq '^[1-9][0-9]*$'
          printf '%s' "$CANDIDATE_DIGEST" | grep -Eq '^[0-9a-f]{64}$'
          printf '%s' "$BASELINE_ID" | grep -Eq '^[1-9][0-9]*$'
          printf '%s' "$BASELINE_DIGEST" | grep -Eq '^[0-9a-f]{64}$'
          printf '%s' "$EVIDENCE_RUN_ID" | grep -Eq '^[1-9][0-9]*$'
          printf '%s' "$EVIDENCE_RUN_ATTEMPT" | grep -Eq '^[1-9][0-9]*$'
          test "$CANDIDATE_NAME" = "desktop-release-$EVIDENCE_RUN_ID-$EVIDENCE_RUN_ATTEMPT"
          test "$BASELINE_NAME" = "desktop-baseline-$EVIDENCE_RUN_ID-$EVIDENCE_RUN_ATTEMPT"
      - name: Exercise native production-feed update
        env:
          ENDURAGENT_MACOS_UPDATE_ROUNDTRIP_MODE: steady
          BASELINE_VERSION: ${{ needs.sign-macos.outputs.baseline_version }}
          CANDIDATE_VERSION: ${{ inputs.desktop_version }}
        run: |
          set -euo pipefail
          CANDIDATE_ENVELOPE="$RUNNER_TEMP/desktop-public-envelope"
          EVIDENCE="$RUNNER_TEMP/macos-update-roundtrip.json"
          pnpm desktop-release:transaction public-envelope \
            --directory "$RUNNER_TEMP/desktop-release" \
            --output "$CANDIDATE_ENVELOPE"
          pnpm --filter @enduragent/desktop test:macos-update-roundtrip \
            "$BASELINE_VERSION" \
            "$CANDIDATE_VERSION" \
            "$RUNNER_TEMP/desktop-baseline" \
            "$CANDIDATE_ENVELOPE" \
            "$EVIDENCE"
      - name: Upload updater round-trip evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-update-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/macos-update-roundtrip.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  activate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [sign-macos, publish-assets, request-latest, reconcile-latest, verify-production-update]
    if: >-
      ${{ always() && needs.publish-assets.result == 'success' &&
          needs.reconcile-latest.result == 'success' &&
          needs.verify-production-update.result == 'success' }}
    environment: desktop-macos-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Bind recovery transaction tooling
        env:
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_TOOLING_COMMIT: ${{ inputs.tooling_commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          if [ "$RELEASE_TOOLING_COMMIT" = "$RELEASE_COMMIT" ]; then
            exit 0
          fi
          git fetch --no-tags origin "$RELEASE_TOOLING_COMMIT"
          git restore --source="$RELEASE_TOOLING_COMMIT" --staged --worktree -- \
            tools/desktop-release-transaction.ts
          test "$(git diff --cached --name-only)" = 'tools/desktop-release-transaction.ts'
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.sign-macos.outputs.artifact_id }}
          path: ${{ runner.temp }}/desktop-release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.sign-macos.outputs.evidence_run_id }}
          digest-mismatch: error
      - name: Bind immutable Actions artifact evidence
        env:
          ARTIFACT_ID: ${{ needs.sign-macos.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.sign-macos.outputs.artifact_digest }}
          ARTIFACT_NAME: ${{ needs.sign-macos.outputs.artifact_name }}
          EVIDENCE_RUN_ID: ${{ needs.sign-macos.outputs.evidence_run_id }}
          EVIDENCE_RUN_ATTEMPT: ${{ needs.sign-macos.outputs.evidence_run_attempt }}
        run: |
          set -euo pipefail
          printf '%s' "$ARTIFACT_ID" | grep -Eq '^[1-9][0-9]*$'
          printf '%s' "$ARTIFACT_DIGEST" | grep -Eq '^[0-9a-f]{64}$'
          printf '%s' "$EVIDENCE_RUN_ID" | grep -Eq '^[1-9][0-9]*$'
          printf '%s' "$EVIDENCE_RUN_ATTEMPT" | grep -Eq '^[1-9][0-9]*$'
          test "$ARTIFACT_NAME" = "desktop-release-$EVIDENCE_RUN_ID-$EVIDENCE_RUN_ATTEMPT"
      - name: Activate bound general-availability body
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BODY=$(awk '/^## /{i++} i==1{print} i==2{exit}' apps/desktop/CHANGELOG.md | tail -n +2)
          printf '%s' "$BODY" > "$RUNNER_TEMP/desktop-release-body.md"
          pnpm desktop-release:transaction activate \
            --directory "$RUNNER_TEMP/desktop-release" \
            --body-file "$RUNNER_TEMP/desktop-release-body.md"

  compensate-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      [
        sign-macos,
        publish-assets,
        request-latest,
        reconcile-latest,
        verify-production-update,
        activate-release,
      ]
    if: >-
      ${{ always() && needs.publish-assets.outputs.latest_id != '' &&
          needs.reconcile-latest.result == 'success' &&
          needs.activate-release.result != 'success' }}
    environment: desktop-macos-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Bind recovery transaction tooling
        env:
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_TOOLING_COMMIT: ${{ inputs.tooling_commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          if [ "$RELEASE_TOOLING_COMMIT" = "$RELEASE_COMMIT" ]; then
            exit 0
          fi
          git fetch --no-tags origin "$RELEASE_TOOLING_COMMIT"
          git restore --source="$RELEASE_TOOLING_COMMIT" --staged --worktree -- \
            tools/desktop-release-transaction.ts
          test "$(git diff --cached --name-only)" = 'tools/desktop-release-transaction.ts'
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.sign-macos.outputs.artifact_id }}
          path: ${{ runner.temp }}/desktop-release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.sign-macos.outputs.evidence_run_id }}
          digest-mismatch: error
      - name: Bind immutable Actions artifact evidence
        env:
          ARTIFACT_ID: ${{ needs.sign-macos.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.sign-macos.outputs.artifact_digest }}
          ARTIFACT_NAME: ${{ needs.sign-macos.outputs.artifact_name }}
          EVIDENCE_RUN_ID: ${{ needs.sign-macos.outputs.evidence_run_id }}
          EVIDENCE_RUN_ATTEMPT: ${{ needs.sign-macos.outputs.evidence_run_attempt }}
        run: |
          set -euo pipefail
          printf '%s' "$ARTIFACT_ID" | grep -Eq '^[1-9][0-9]*$'
          printf '%s' "$ARTIFACT_DIGEST" | grep -Eq '^[0-9a-f]{64}$'
          printf '%s' "$EVIDENCE_RUN_ID" | grep -Eq '^[1-9][0-9]*$'
          printf '%s' "$EVIDENCE_RUN_ATTEMPT" | grep -Eq '^[1-9][0-9]*$'
          test "$ARTIFACT_NAME" = "desktop-release-$EVIDENCE_RUN_ID-$EVIDENCE_RUN_ATTEMPT"
      - name: Restore prior latest and withdraw candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_LATEST_ID: ${{ needs.publish-assets.outputs.rollback_latest_id }}
          EXPECTED_LATEST_TAG: ${{ needs.publish-assets.outputs.rollback_latest_tag }}
          EXPECTED_LATEST_METADATA_SHA256: ${{ needs.publish-assets.outputs.rollback_latest_metadata_sha256 }}
        run: |
          set -euo pipefail
          BODY=$(awk '/^## /{i++} i==1{print} i==2{exit}' apps/desktop/CHANGELOG.md | tail -n +2)
          printf '%s' "$BODY" > "$RUNNER_TEMP/desktop-release-body.md"
          pnpm desktop-release:transaction compensate \
            --directory "$RUNNER_TEMP/desktop-release" \
            --body-file "$RUNNER_TEMP/desktop-release-body.md" \
            --expected-latest-id "$EXPECTED_LATEST_ID" \
            --expected-latest-tag "$EXPECTED_LATEST_TAG" \
            --expected-latest-metadata-sha256 "$EXPECTED_LATEST_METADATA_SHA256"

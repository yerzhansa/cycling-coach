version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Dependabot discovers pnpm workspace members from pnpm-workspace.yaml, so one root entry covers their manifests.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "fit-file-parser"
    # Bundle compatible routine updates to keep PR volume manageable; major
    # upgrades remain separate so their migration risk can be reviewed alone.
    groups:
      routine-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: docker
    directory: /packages/cycling-coach
    schedule:
      interval: weekly
    # Hold the base image on its current Node LTS line; take digest/minor/patch
    # security updates automatically but bump the major by hand to the next LTS
    # (even majors), skipping odd-numbered Current releases.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

appId: icu.enduragent.desktop
productName: Enduragent
asar: true
directories:
  output: dist
files:
  - out/**
  - package.json
  - from: resources
    to: resources
    filter:
      - trayTemplate.png
      - trayTemplate@2x.png
  - from: dist/self-test-asar
    to: .
extraResources:
  - from: dist/extra-resources
    to: .
mac:
  target:
    - target: dir
      arch: [arm64]
